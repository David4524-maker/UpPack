<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UpPack</title>
<style>
:root{--o:#FF4500;--od:#D63A00;--bg:#F3F5F8;--tx:#1f2430;--mu:#6b7480;--d:#C62828}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:3px solid var(--o);display:flex;align-items:center;gap:12px;padding:10px 22px}
header svg{height:64px;width:auto}
h1{margin:0;font-size:30px;color:var(--o);line-height:1}
.tag{color:var(--mu);font-size:13px}
.sp{flex:1}
select{font:inherit;padding:7px 10px;border:1px solid #cfd5dc;border-radius:8px;background:#fff}
main{max-width:860px;margin:0 auto;padding:22px;display:grid;gap:16px}
.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{margin:0 0 8px;font-size:15px}
.bar{height:12px;background:#E1E5EA;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--o);transition:width .3s}
.bar.s{height:5px;margin-top:10px}.bar.s i{background:var(--od);transition:none}
.mu{color:var(--mu)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:700;color:var(--od);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--o)}
.drop{border:2px dashed #f5a58a;border-radius:14px;padding:26px;text-align:center;background:#fff7f4;cursor:pointer;font-weight:700;color:var(--od)}
.drop.on{background:#ffe6dc}
.hd{display:flex;align-items:center;justify-content:space-between}
.b{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:#E3E7EB;color:var(--tx);cursor:pointer}
.b.p{background:var(--o);color:#fff;font-weight:700}.b.p:hover{background:var(--od)}
.row{display:grid;grid-template-columns:1fr 90px 160px 36px;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid #eef0f3}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm.fl{color:var(--d)}
.sz,.dt{color:var(--mu);font-size:13px}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;border-radius:8px;padding:4px}.x:hover{background:#fde8e8;color:var(--d)}
.empty{color:var(--mu);text-align:center;padding:22px}
#st{color:var(--mu);font-size:13px;min-height:18px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md[hidden]{display:none}
.dlg{background:#fff;border-radius:14px;max-width:440px;width:100%;overflow:hidden}
.dh{background:var(--d);color:#fff;font-weight:700;padding:14px 18px}
.db{padding:14px 18px 0}.db p{margin:0 0 8px}.fn{color:var(--d);font-weight:700;word-break:break-all}
.db ul{margin:4px 0 0;padding-left:20px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:16px 18px}
/* versión celular */
.mobile header{padding:8px 12px}.mobile header svg{height:48px}.mobile h1{font-size:24px}
.mobile main{padding:12px;padding-bottom:96px}
.mobile .drop{display:none}
.mobile .up{position:fixed;left:12px;right:12px;bottom:12px;padding:17px;font-size:17px;z-index:5;box-shadow:0 4px 14px rgba(214,58,0,.4)}
.mobile .row{grid-template-columns:1fr 40px;grid-template-areas:"n x" "s x";padding:12px 2px}
.mobile .nm{grid-area:n;font-size:16px}.mobile .sz{grid-area:s}.mobile .dt{display:none}.mobile .x{grid-area:x;font-size:22px}
.mobile .dlg .df{flex-direction:column}.mobile .dlg .b{padding:15px}
</style>
</head>

const used=()=>S.files.reduce((a,f)=>a+f.size,0),quota=()=>BASE+(S.free19?BONUS:0);
const say=m=>{$('#st').textContent=m};

function isMobile(){return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||matchMedia('(max-width:700px)').matches}
function layout(){document.body.classList.toggle('mobile',isMobile())}
addEventListener('resize',layout);layout();

function applyLang(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=(S.lang==='ar'||S.lang==='he')?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#lg').value=S.lang;render();
}
function render(){
  const u=used(),q=quota();
  $('#sb').style.width=Math.min(100,100*u/q)+'%';
  $('#sl').textContent=fmt(u)+' / '+fmt(q)+'  ('+(100*u/q).toFixed(1)+'%)';
  $('#f19').checked=S.free19;
  const L=$('#list');
  if(!S.files.length){L.innerHTML='<div class="empty">'+esc(t('empty'))+'</div>';return}
  L.innerHTML=[...S.files].reverse().map(f=>`<div class="row"><div class="nm ${f.flag?'fl':''}">${f.flag?'⚠':'✓'} ${esc(f.name)}</div><div class="sz">${fmt(f.size)}</div><div class="dt">${new Date(f.date).toLocaleString()}</div><button class="x" data-id="${f.id}" title="${esc(t('delete'))}">✕</button></div>`).join('');
}

/* Escáner heurístico (lee solo los primeros 1 MB; el archivo nunca se modifica) */
async function scan(f){
  const n=f.name.toLowerCase(),ext=n.includes('.')?n.slice(n.lastIndexOf('.')):'',r=[];
  let h=new Uint8Array(0);
  try{h=new Uint8Array(await f.slice(0,1<<20).arrayBuffer())}catch(e){}
  const mz=h[0]===0x4d&&h[1]===0x5a,elf=h[0]===0x7f&&h[1]===0x45&&h[2]===0x4c&&h[3]===0x46;
  if(DEXT.has(ext)||mz||elf)r.push('r_exec');
  const txt=new TextDecoder('latin1').decode(h).toLowerCase();
  if(SIGS.some(s=>txt.includes(s)))r.push('r_sig');
  if(PIRATE.test(n))r.push('r_pirate');
  return r;
}
function ask(name,reasons){
  return new Promise(res=>{
    $('#mfn').textContent=name;
    $('#mrs').innerHTML=reasons.map(r=>'<li>'+esc(t(r))+'</li>').join('');
    const m=$('#md');m.hidden=false;
    const end=v=>{m.hidden=true;$('#bA').onclick=$('#bS').onclick=m.onclick=null;res(v)};
    $('#bA').onclick=()=>end('accept');$('#bS').onclick=()=>end('save');
    m.onclick=e=>{if(e.target===m)end('accept')};
  });
}
async function fake(size){
  const ms=Math.min(2500,500+size/(2*1024*1024)*100),t0=performance.now();
  for(;;){const p=Math.min(1,(performance.now()-t0)/ms);$('#pg').style.width=p*100+'%';if(p>=1)break;await new Promise(r=>requestAnimationFrame(r))}
}
async function handle(files){
  if(busy)return;busy=true;
  for(const f of files){
    const r=await scan(f);let flag=false;
    if(r.length){if(await ask(f.name,r)==='accept'){say(t('blocked')+': '+f.name);continue}flag=true}
    if(used()+f.size>quota()){say(t('no_space')+': '+f.name);continue}
    await fake(f.size);
    /* simulación: solo se guarda nombre/tamaño; tu archivo original no se toca */
    S.files.push({id:String(Date.now())+Math.random().toString(36).slice(2),name:f.name,size:f.size,date:Date.now(),flag});
    save();render();say(t('saved')+': '+f.name);
  }
  busy=false;$('#pg').style.width='0';
}

LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;$('#lg').appendChild(o)});
$('#lg').onchange=e=>{S.lang=e.target.value;save();applyLang()};
$('#f19').onchange=e=>{
  if(!e.target.checked&&used()>BASE){e.target.checked=true;say(t('no_space'));return}
  S.free19=e.target.checked;save();render();
};
$('#up').onclick=()=>$('#fi').click();
$('#dz').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{handle([...e.target.files]);e.target.value=''};
const dz=$('#dz');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>handle([...e.dataTransfer.files]));
$('#list').onclick=e=>{
  const b=e.target.closest('.x');if(!b)return;
  if(!confirm(t('confirm_delete')))return;
  S.files=S.files.filter(f=>f.id!==b.dataset.id);save();render();
};
applyLang();
</script>
</body>
</html>
